# Render Blueprint: the API as a Docker web service.
# DATABASE_URL (Neon), JWT_SECRET and TMDB_TOKEN are secrets, so they are typed in Render's dashboard.
services:
  - type: web
    name: movies-platform-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_TOKEN
        sync: false

  # The website (Next.js), reading from the API above
  - type: web
    name: movies-platform-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: API_URL
        value: https://movies-platform-api.onrender.com
