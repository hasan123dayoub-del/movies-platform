# Runs on every push and pull request: tests the API, then builds the website against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL just for this run, like the Docker one used locally
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movies" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://movies:movies@localhost:5432/movies_test
      TEST_DATABASE_URL: postgresql://movies:movies@localhost:5432/movies_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Website (lint, build, typecheck)
    runs-on: ubuntu-latest
    # The pages are pre-rendered from the API's data, so start the API first
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movies" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://movies:movies@localhost:5432/movies
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start the API with the sample data
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
          npm run build
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && exit 0; sleep 2; done
          cat api.log; exit 1

      - name: Lint, build and typecheck the website
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run typecheck
